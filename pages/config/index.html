<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC 同步配置</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-muted: #f8fafc;
      --text: #172033;
      --muted: #657083;
      --border: #d9e0ea;
      --accent: #2f6fed;
      --accent-strong: #2456ba;
      --danger: #c53b3b;
      --success: #197449;
      --shadow: 0 8px 24px rgba(25, 39, 64, .07);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #121720;
      --panel: #1b2430;
      --panel-muted: #202b39;
      --text: #edf2f8;
      --muted: #aab6c5;
      --border: #344153;
      --accent: #75a7ff;
      --accent-strong: #9fc2ff;
      --danger: #ff8e8e;
      --success: #69d49d;
      --shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 28px 22px 48px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 25px; letter-spacing: 0; }
    h2 { font-size: 18px; letter-spacing: 0; }
    h3 { font-size: 15px; letter-spacing: 0; }
    .subtitle { color: var(--muted); margin-top: 5px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .button {
      border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text);
      padding: 8px 13px; min-height: 38px; font-weight: 600;
    }
    .button:hover { border-color: var(--accent); }
    .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { background: var(--accent-strong); }
    .button.danger { color: var(--danger); }
    .button.small { padding: 5px 9px; min-height: 32px; font-size: 13px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; box-shadow: var(--shadow); }
    .status-panel { padding: 17px 18px; margin-bottom: 18px; }
    .status-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 9px; }
    .status-item { background: var(--panel-muted); border: 1px solid var(--border); border-radius: 6px; padding: 11px 12px; }
    .status-name { display: flex; justify-content: space-between; gap: 10px; font-weight: 650; }
    .status-meta { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-word; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--danger); }
    .dot.online { background: var(--success); }
    .empty { color: var(--muted); padding: 18px 0; text-align: center; }
    .server-list { display: grid; gap: 16px; }
    .server { padding: 18px; }
    .server-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .server-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .server-title input { font-size: 17px; font-weight: 700; min-width: 0; }
    .server-index { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .server-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label, legend { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 6px; }
    input, textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text);
      padding: 8px 10px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
    textarea { min-height: 74px; resize: vertical; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
    .toggle { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; font-weight: 500; margin: 0; }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
    #message { min-height: 20px; color: var(--muted); }
    #message.success { color: var(--success); }
    #message.error { color: var(--danger); }
    @media (max-width: 680px) {
      .shell { padding: 20px 14px 36px; }
      .header, .server-head, .footer { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .server-fields, .toggles { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1 id="page-title">MC 同步配置</h1>
        <p class="subtitle">为每个 Minecraft 服务器分别管理会话、权限、事件和 RCON。</p>
      </div>
      <div class="actions">
        <button class="button" id="refresh" type="button">刷新状态</button>
        <button class="button primary" id="add-server" type="button">添加服务器</button>
      </div>
    </header>

    <section class="panel status-panel" aria-labelledby="status-title">
      <div class="status-head">
        <h2 id="status-title">连接状态</h2>
        <span class="hint" id="status-time">尚未刷新</span>
      </div>
      <div class="status-grid" id="status-list"><p class="empty">正在读取连接状态...</p></div>
    </section>

    <section class="server-list" id="server-list" aria-live="polite"></section>
    <div class="footer">
      <span id="message" role="status"></span>
      <button class="button primary" id="save" type="button">保存全部配置</button>
    </div>
  </main>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module">
    const bridge = window.AstrBotPluginPage;
    const state = { config: { sync_config: [] }, statuses: [] };
    const eventOptions = [
      ["forward_player_join", "转发玩家上线"],
      ["forward_player_quit", "转发玩家下线"],
      ["forward_player_death", "转发玩家死亡"],
      ["forward_player_achievement", "转发玩家成就"]
    ];

    const $ = (selector, root = document) => root.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
    }[char]));
    const csv = (value) => value.split(/[\n,]/).map((item) => item.trim()).filter(Boolean);
    const showMessage = (text, type = "") => {
      const node = $("#message");
      node.textContent = text;
      node.className = type;
    };

    function renderStatuses() {
      const node = $("#status-list");
      if (!state.statuses.length) {
        node.innerHTML = '<p class="empty">暂无连接记录。服务器连接后会显示在这里。</p>';
      } else {
        node.innerHTML = state.statuses.map((item) => {
          const error = item.last_error ? `错误：${escapeHtml(item.last_error)}` : `重试次数：${item.attempts ?? 0}`;
          const time = item.last_event_at ? `最近事件：${escapeHtml(item.last_event_at)}` : "暂无事件记录";
          return `<div class="status-item"><div class="status-name"><span><i class="dot ${item.connected ? "online" : ""}"></i>${escapeHtml(item.server_name)}</span><span>${item.connected ? "已连接" : "未连接"}</span></div><div class="status-meta">${error}<br>${time}</div></div>`;
        }).join("");
      }
      $("#status-time").textContent = `更新于 ${new Date().toLocaleTimeString()}`;
    }

    function serverTemplate(server, index) {
      const eventToggles = eventOptions.map(([key, label]) => `<label class="toggle"><input type="checkbox" data-key="${key}" ${server[key] !== false ? "checked" : ""}>${label}</label>`).join("");
      return `<article class="panel server" data-index="${index}">
        <div class="server-head"><div class="server-title"><span class="server-index">服务器 ${index + 1}</span><input data-key="server_name" value="${escapeHtml(server.server_name)}" placeholder="例如 survival-1" aria-label="服务器名称"></div><button class="button danger small remove-server" type="button">删除服务器</button></div>
        <div class="server-fields">
          <div class="field full"><label>绑定会话 UID</label><textarea data-key="umo_list" placeholder="每行一个 UMO，也支持逗号分隔">${escapeHtml((server.umo_list || []).join("\n"))}</textarea><p class="hint">服务器消息只会转发到这些已绑定的会话。</p></div>
          <div class="field full"><label>服务器管理员 UID</label><textarea data-key="administrators" placeholder="每行一个 UID，也支持逗号分隔">${escapeHtml((server.administrators || []).join("\n"))}</textarea><p class="hint">框架 ADMIN 始终有效；这里的 UID 可使用 admin-add 命令维护。</p></div>
          <fieldset class="field"><legend>功能开关</legend><div class="toggles"><label class="toggle"><input type="checkbox" data-key="forward_session_messages" ${server.forward_session_messages !== false ? "checked" : ""}>转发会话消息到服务器</label><label class="toggle"><input type="checkbox" data-key="cicode_enabled" ${server.cicode_enabled !== false ? "checked" : ""}>启用 CICode</label>${eventToggles}</div></fieldset>
          <fieldset class="field"><legend>RCON</legend><label class="toggle"><input type="checkbox" data-key="rcon_enabled" ${server.rcon_enabled ? "checked" : ""}>允许 RCON 调用</label><p class="hint">仅服务器管理员可用，且必须命中白名单。</p></fieldset>
          <div class="field full"><label>RCON 命令白名单</label><textarea data-key="rcon_command_whitelist" placeholder="每行一个命令前缀，例如 list 或 time set">${escapeHtml((server.rcon_command_whitelist || []).join("\n"))}</textarea><p class="hint">填写 * 可允许所有命令。命令不需要填写开头的斜杠。</p></div>
        </div>
      </article>`;
    }

    function renderServers() {
      const node = $("#server-list");
      if (!state.config.sync_config.length) {
        node.innerHTML = '<div class="panel empty">还没有服务器配置，请先添加服务器。</div>';
        return;
      }
      node.innerHTML = state.config.sync_config.map(serverTemplate).join("");
    }

    function readForm() {
      const servers = [...document.querySelectorAll(".server")].map((article) => {
        const value = (key) => article.querySelector(`[data-key="${key}"]`);
        const server = { ...state.config.sync_config[Number(article.dataset.index)] };
        article.querySelectorAll("[data-key]").forEach((input) => {
          const key = input.dataset.key;
          if (input.type === "checkbox") server[key] = input.checked;
          else if (["umo_list", "administrators", "rcon_command_whitelist"].includes(key)) server[key] = csv(input.value);
          else server[key] = input.value.trim();
        });
        return server;
      });
      return { ...state.config, sync_config: servers };
    }

    async function loadConfig() {
      const config = await bridge.apiGet("config");
      state.config = { sync_config: [], ...config };
      renderServers();
    }

    async function loadStatus() {
      state.statuses = await bridge.apiGet("status");
      renderStatuses();
    }

    $("#add-server").addEventListener("click", () => {
      state.config.sync_config.push({ server_name: "", umo_list: [], forward_session_messages: true, cicode_enabled: true, administrators: [], forward_player_join: true, forward_player_quit: true, forward_player_death: true, forward_player_achievement: true, rcon_enabled: false, rcon_command_whitelist: [] });
      renderServers();
      const names = document.querySelectorAll('[data-key="server_name"]');
      names[names.length - 1]?.focus();
    });
    $("#server-list").addEventListener("click", (event) => {
      if (!event.target.classList.contains("remove-server")) return;
      const article = event.target.closest(".server");
      state.config.sync_config.splice(Number(article.dataset.index), 1);
      renderServers();
    });
    $("#save").addEventListener("click", async () => {
      const button = $("#save");
      button.disabled = true;
      showMessage("正在保存...");
      try {
        const payload = readForm();
        const names = payload.sync_config.map((server) => server.server_name);
        if (names.some((name) => !name)) throw new Error("服务器名称不能为空");
        if (new Set(names).size !== names.length) throw new Error("服务器名称不能重复");
        state.config = await bridge.apiPost("config", payload);
        renderServers();
        showMessage("配置已保存", "success");
      } catch (error) {
        showMessage(error.message || "保存失败", "error");
      } finally {
        button.disabled = false;
      }
    });
    $("#refresh").addEventListener("click", async () => {
      try { await loadStatus(); showMessage("连接状态已刷新", "success"); }
      catch (error) { showMessage(error.message || "状态刷新失败", "error"); }
    });

    try {
      await bridge.ready();
      document.title = bridge.t("pages.config.title", "MC 同步配置");
      await Promise.all([loadConfig(), loadStatus()]);
      bridge.onContext(() => { document.documentElement.dataset.theme = bridge.getContext()?.isDark ? "dark" : "light"; });
    } catch (error) {
      showMessage(error.message || "页面初始化失败", "error");
      $("#server-list").innerHTML = '<div class="panel empty">无法读取插件配置，请检查插件是否已加载。</div>';
    }
  </script>
</body>
</html>
